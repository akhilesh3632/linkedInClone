spring.application.name=connections-service

server.servlet.context-path=/connections
server.port=9030
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

spring.neo4j.uri=bolt://connection-db:7687
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.neo4j.database=Linkedindb
# Kafka broker ? application running from IntelliJ on Windows
spring.kafka.bootstrap-servers=kafka:9094

# Producer serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer