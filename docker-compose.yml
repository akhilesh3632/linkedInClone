services:

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:2026.09.0
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/lampu@3632
      NEO4J_initial_dbms_default__database: LinkedInDB
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs: